[package]
name = "mantishash"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }

zeroize = "1.8"

image = "0.25"
blake2 = "0.10"
aes-gcm = "0.10"
ed25519-dalek = "2.0"
secp256k1 = "0.31"

tiny-keccak = { version = "2.0.0", features = ["keccak"] }

hex = "0.4"
rand = "0.8"

base58= "0.2"
sha2 = "0.10"
ripemd = "0.1"